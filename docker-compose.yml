services:
  postgres:
    image: postgres:16-alpine
    container_name: medisearch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medisearch
      POSTGRES_PASSWORD: medisearch_dev
      POSTGRES_DB: medisearch
    ports:
      - "5432:5432"
    volumes:
      - medisearch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medisearch -d medisearch"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: medisearch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - medisearch_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  medisearch_pgdata:
  medisearch_redisdata:
