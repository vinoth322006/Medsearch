# =============================================================================
# MedSearch — Production Docker Compose (Streamlined: 3 containers)
# =============================================================================
# Express serves BOTH the API and React SPA — no separate Nginx container.
#
# Usage:
#   1. Create server/.env.prod with production values
#   2. docker compose -f docker-compose.prod.yml up -d --build
#   3. docker compose -f docker-compose.prod.yml exec server npm run seed  (first time)
# =============================================================================

services:
  # ── PostgreSQL 16 ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: medsearch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medisearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-medisearch}
    volumes:
      - medsearch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medisearch} -d ${POSTGRES_DB:-medisearch}"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - medsearch

  # ── Redis 7 ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medsearch-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - medsearch_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - medsearch

  # ── MedSearch App (Express: API + React SPA) ───────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medsearch-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./server/.env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medisearch}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-medisearch}?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: "4000"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    ports:
      - "${HOST_PORT:-80}:4000"
    networks:
      - medsearch

volumes:
  medsearch_pgdata:
  medsearch_redisdata:

networks:
  medsearch:
    driver: bridge
